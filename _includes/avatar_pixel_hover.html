<script>
  // Hover the sidebar avatar: it pixelates up into chunky blocks, swaps to the
  // alternate portrait at peak blockiness, then resolves back to full detail.
  // Driven by author.avatar_hover in _config.yml; no-ops if that image is absent.
  (function () {
    var wrap = document.querySelector('div.author__avatar');
    if (!wrap) return;
    var img = wrap.querySelector('img');
    if (!img) return;
    var hoverSrc = img.getAttribute('data-hover-src');
    if (!hoverSrc || !window.requestAnimationFrame) return;

    var MAX_BLOCK = 26;   // pixel size at the blockiest point of the transition
    var OUT_MS = 300;     // detail -> blocks
    var IN_MS = 420;      // blocks -> detail
    var reduce = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var hoverImg = new Image();
    var ready = false;
    hoverImg.onload = function () {
      ready = true;
      if (img.matches(':hover')) toHover();
    };

    var canvas = document.createElement('canvas');
    canvas.className = 'author__avatar-fx';
    canvas.setAttribute('aria-hidden', 'true');
    // Keep essential geometry beside the script: even an older cached stylesheet
    // must never put the canvas into normal flow as a second portrait.
    canvas.style.cssText = 'position:absolute;display:none;border-radius:50%;pointer-events:none;';
    wrap.style.position = 'relative';
    var ctx = canvas.getContext('2d');
    var buffer = document.createElement('canvas');
    var bufferCtx = buffer.getContext('2d');
    if (!ctx || !bufferCtx) return;
    wrap.appendChild(canvas);
    wrap.classList.add('has-avatar-fx');

    var raf = null;
    var on = false;
    var progress = 0;

    // Lay the canvas exactly over the avatar's content box, so the existing
    // padding and border ring stay visible around it.
    function place() {
      var wr = wrap.getBoundingClientRect();
      var ir = img.getBoundingClientRect();
      var cs = window.getComputedStyle(img);
      var pl = parseFloat(cs.paddingLeft) || 0;
      var pt = parseFloat(cs.paddingTop) || 0;
      var pr = parseFloat(cs.paddingRight) || 0;
      var pb = parseFloat(cs.paddingBottom) || 0;
      var bl = parseFloat(cs.borderLeftWidth) || 0;
      var bt = parseFloat(cs.borderTopWidth) || 0;
      var br = parseFloat(cs.borderRightWidth) || 0;
      var bb = parseFloat(cs.borderBottomWidth) || 0;
      var w = ir.width - pl - pr - bl - br;
      var h = ir.height - pt - pb - bt - bb;
      if (w <= 0 || h <= 0) return false;

      canvas.style.left = (ir.left - wr.left + bl + pl) + 'px';
      canvas.style.top = (ir.top - wr.top + bt + pt) + 'px';
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      return true;
    }

    // Draw `source` cover-cropped into a small buffer, then blow that buffer
    // back up with smoothing off — which is what produces the blocks.
    function draw(source, block) {
      var W = canvas.width, H = canvas.height;
      if (!W || !H) return;
      var sw = Math.max(1, Math.round(W / block));
      var sh = Math.max(1, Math.round(H / block));
      var iw = source.naturalWidth || source.width;
      var ih = source.naturalHeight || source.height;
      if (!iw || !ih) return;

      var scale = Math.max(sw / iw, sh / ih);
      var dw = iw * scale, dh = ih * scale;

      buffer.width = sw;
      buffer.height = sh;
      bufferCtx.drawImage(source, (sw - dw) / 2, (sh - dh) / 2, dw, dh);
      ctx.clearRect(0, 0, W, H);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(buffer, 0, 0, sw, sh, 0, 0, W, H);
    }

    function ease(p) {
      return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    }

    function stop() {
      if (raf) { window.cancelAnimationFrame(raf); raf = null; }
    }

    function animate(dur, frame, done) {
      stop();
      var t0 = window.performance ? performance.now() : Date.now();
      // Paint frame zero synchronously: a backgrounded tab pauses rAF, and the
      // canvas must never be left blank on top of the avatar.
      frame(0);
      raf = window.requestAnimationFrame(function step(now) {
        var p = Math.min(1, (now - t0) / dur);
        frame(p);
        if (p < 1) raf = window.requestAnimationFrame(step);
        else { raf = null; if (done) done(); }
      });
    }

    function setVisible(visible) {
      canvas.style.display = visible ? 'block' : 'none';
      canvas.classList.toggle('is-on', visible);
    }

    function render() {
      // A single reversible timeline keeps rapid enter/leave gestures continuous.
      var split = OUT_MS / (OUT_MS + IN_MS);
      var source = progress < split ? img : hoverImg;
      var pixelation = progress < split ?
        ease(progress / split) : 1 - ease((progress - split) / (1 - split));
      draw(source, 1 + (MAX_BLOCK - 1) * pixelation);
    }

    function transition(hover) {
      if (!ready || !img.complete || !img.naturalWidth || !place()) return;
      on = hover;
      stop();
      var target = hover ? 1 : 0;
      if (reduce || progress === target) {
        progress = target;
        render();
        setVisible(hover);
        return;
      }
      var start = progress;
      animate((OUT_MS + IN_MS) * Math.abs(target - start), function (p) {
        progress = start + (target - start) * p;
        render();
      }, function () {
        if (!on) setVisible(false);
      });
      setVisible(true);
    }

    function toHover() { transition(true); }
    function toBase() { transition(false); }

    // Only the portrait is the hover target, not the empty sidebar beside it.
    img.addEventListener('pointerenter', function (event) {
      if (event.pointerType !== 'touch') toHover();
    });
    img.addEventListener('pointerleave', function (event) {
      if (event.pointerType !== 'touch') toBase();
    });
    img.addEventListener('pointerup', function (event) {
      if (event.pointerType === 'touch') transition(!on);
    });
    img.addEventListener('load', function () {
      if (img.matches(':hover')) toHover();
    });
    hoverImg.src = hoverSrc;

    window.addEventListener('resize', function () {
      if ((on || progress > 0) && place()) render();
    });
  })();
</script>
